<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}TDEE Tracker{% endblock %}</title>
    <link rel="stylesheet" href="/static/style.css">
    {% block head %}{% endblock %}
  </head>
  <body>
    <main class="{% block main_class %}{% endblock %}">
      <nav aria-label="Main navigation">
        {% for path, label in [('/', 'Today'), ('/history', 'History'), ('/settings', 'Settings')] %}
          <a href="{{ path }}" {% if request.url.path == path %}aria-current="page"{% endif %}>{{ label }}</a>
        {% endfor %}
      </nav>
      {% block content %}{% endblock %}
    </main>
  </body>
</html>
